      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: "objects/{{ stream_partition.attribute.object_id }}/attributes/{{ stream_partition.attribute.attribute_id }}/statuses"
          http_method: GET
          request_parameters:
