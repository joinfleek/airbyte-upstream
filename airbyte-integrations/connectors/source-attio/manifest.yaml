version: 6.48.10

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - objects

definitions:
  authenticator:
    type: BearerAuthenticator
    api_token: "{{ config['api_token'] }}"

  error_handler:
    type: DefaultErrorHandler
    max_retries: 5
    backoff_strategies:
      - type: WaitTimeFromHeader
        header: Retry-After
      - type: ExponentialBackoffStrategy
        factor: 2
    response_filters:
      - type: HttpResponseFilter
        action: FAIL
        failure_type: config_error
        http_codes: [401, 403]
        error_message: >-
          The Attio token is invalid or does not have the required read scopes.
      - type: HttpResponseFilter
        action: RATE_LIMITED
        http_codes: [429]
        error_message: Attio API rate limit reached.
      - type: HttpResponseFilter
        action: RETRY
        http_codes: [500, 502, 503, 504]
        error_message: Attio API is temporarily unavailable.

  base_requester:
    type: HttpRequester
    url_base: https://api.attio.com/v2/
    use_cache: false
    authenticator:
      $ref: "#/definitions/authenticator"
    error_handler:
      $ref: "#/definitions/error_handler"
    request_headers:
      Accept: application/json

  offset_paginator_query:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: offset
    page_size_option:
      type: RequestOption
      inject_into: request_parameter
      field_name: limit
    pagination_strategy:
      type: OffsetIncrement
      page_size: 50

  offset_paginator_body:
    type: DefaultPaginator
    page_token_option:
      type: RequestOption
      inject_into: body_json
      field_name: offset
    page_size_option:
      type: RequestOption
      inject_into: body_json
      field_name: limit
    pagination_strategy:
      type: OffsetIncrement
      page_size: 500

  data_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
        - data

  select_attribute_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
        - data
    record_filter:
      type: RecordFilter
      condition: "{{ record.get('type') == 'select' }}"

  status_attribute_selector:
    type: RecordSelector
    extractor:
      type: DpathExtractor
      field_path:
        - data
    record_filter:
      type: RecordFilter
      condition: "{{ record.get('type') == 'status' }}"

  streams:
    objects:
      type: DeclarativeStream
      name: objects
      primary_key:
        - workspace_id
        - object_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: objects
          http_method: GET
        record_selector:
          $ref: "#/definitions/data_selector"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path: [workspace_id]
              value: "{{ record['id']['workspace_id'] }}"
            - type: AddedFieldDefinition
              path: [object_id]
              value: "{{ record['id']['object_id'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/object"

    lists:
      type: DeclarativeStream
      name: lists
      primary_key:
        - workspace_id
        - list_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: lists
          http_method: GET
        record_selector:
          $ref: "#/definitions/data_selector"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path: [workspace_id]
              value: "{{ record['id']['workspace_id'] }}"
            - type: AddedFieldDefinition
              path: [list_id]
              value: "{{ record['id']['list_id'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/list"

    workspace_members:
      type: DeclarativeStream
      name: workspace_members
      primary_key:
        - workspace_id
        - workspace_member_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: workspace_members
          http_method: GET
        record_selector:
          $ref: "#/definitions/data_selector"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path: [workspace_id]
              value: "{{ record['id']['workspace_id'] }}"
            - type: AddedFieldDefinition
              path: [workspace_member_id]
              value: "{{ record['id']['workspace_member_id'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/workspace_member"

    object_attributes:
      type: DeclarativeStream
      name: object_attributes
      primary_key:
        - workspace_id
        - target_id
        - attribute_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: "objects/{{ stream_partition.object_slug }}/attributes"
          http_method: GET
          request_parameters:
            show_archived: "true"
            limit: "500"
        record_selector:
          $ref: "#/definitions/data_selector"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: api_slug
              partition_field: object_slug
              stream:
                $ref: "#/definitions/streams/objects"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path: [_airbyte_attio_object_slug]
              value: "{{ stream_partition.object_slug }}"
            - type: AddedFieldDefinition
              path: [workspace_id]
              value: "{{ record['id']['workspace_id'] }}"
            - type: AddedFieldDefinition
              path: [target_id]
              value: "{{ record['id']['object_id'] }}"
            - type: AddedFieldDefinition
              path: [attribute_id]
              value: "{{ record['id']['attribute_id'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/object_attribute"

    records:
      type: DeclarativeStream
      name: records
      primary_key:
        - workspace_id
        - object_id
