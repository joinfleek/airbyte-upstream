        - option_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: "lists/{{ stream_partition.attribute.object_id }}/attributes/{{ stream_partition.attribute.attribute_id }}/options"
          http_method: GET
          request_parameters:
            show_archived: "true"
        record_selector:
