        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              partition_field: attribute
              stream:
                $ref: "#/definitions/streams/object_select_attributes"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path: [workspace_id]
              value: "{{ record['id']['workspace_id'] }}"
            - type: AddedFieldDefinition
              path: [target_id]
              value: "{{ record['id']['object_id'] }}"
            - type: AddedFieldDefinition
              path: [attribute_id]
              value: "{{ record['id']['attribute_id'] }}"
            - type: AddedFieldDefinition
