schemas:
  object:
    type: object
    additionalProperties: true
    required: [id, api_slug]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      object_id:
        type: string
      api_slug:
        type: string
      created_at:
        type: string
      plural_noun:
        type: string
      singular_noun:
        type: string
  list:
    type: object
    additionalProperties: true
    required: [id, api_slug]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      list_id:
        type: string
      api_slug:
        type: string
      created_at:
        type: string
      created_by_actor:
        type: object
        additionalProperties: true
      name:
        type: string
      parent_object:
        type: array
        items:
          type: string
      workspace_access:
        type: string
      workspace_member_access:
        type: array
        items:
          type: object
          additionalProperties: true
  workspace_member:
    type: object
    additionalProperties: true
    required: [id]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      workspace_member_id:
        type: string
      access_level:
        type: string
      avatar_url:
        type:
          - "null"
          - string
      created_at:
        type: string
      email_address:
        type: string
      first_name:
        type: string
      last_name:
        type: string
  object_attribute:
    type: object
    additionalProperties: true
    required: [id]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      target_id:
        type: string
      attribute_id:
        type: string
      _airbyte_attio_object_slug:
        type: string
      api_slug:
        type: string
      config:
        type: object
        additionalProperties: true
      created_at:
        type: string
      default_value:
        type:
          - "null"
          - object
        additionalProperties: true
      description:
        type:
          - "null"
          - string
      is_archived:
        type: boolean
      is_default_value_enabled:
        type: boolean
      is_multiselect:
        type: boolean
      is_required:
        type: boolean
      is_system_attribute:
        type: boolean
      is_unique:
        type: boolean
      is_writable:
        type: boolean
      relationship:
        type:
          - "null"
          - object
        additionalProperties: true
      title:
        type: string
      type:
        type: string
  record:
    type: object
    additionalProperties: true
    required: [id]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      object_id:
        type: string
      record_id:
        type: string
      values:
        type: object
        additionalProperties: true
      _airbyte_attio_object_slug:
        type: string
      created_at:
        type: string
      web_url:
        type: string
  list_attribute:
    type: object
    additionalProperties: true
    required: [id]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      target_id:
        type: string
      attribute_id:
        type: string
      _airbyte_attio_list_slug:
        type: string
      api_slug:
        type: string
      config:
        type: object
        additionalProperties: true
      created_at:
        type: string
      default_value:
        type:
          - "null"
          - object
        additionalProperties: true
      description:
        type:
          - "null"
          - string
      is_archived:
        type: boolean
      is_default_value_enabled:
        type: boolean
      is_multiselect:
        type: boolean
      is_required:
        type: boolean
      is_system_attribute:
        type: boolean
      is_unique:
        type: boolean
      is_writable:
        type: boolean
      relationship:
        type:
          - "null"
          - object
        additionalProperties: true
      title:
        type: string
      type:
        type: string
  entry:
    type: object
    additionalProperties: true
    required: [id]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      list_id:
        type: string
      entry_id:
        type: string
      entry_values:
        type: object
        additionalProperties: true
      _airbyte_attio_list_slug:
        type: string
      created_at:
        type: string
      parent_object:
        type: string
      parent_record_id:
        type: string
  note:
    type: object
    additionalProperties: true
    required: [id]
    properties:
      id:
        type: object
        additionalProperties: true
      workspace_id:
        type: string
      note_id:
        type: string
      content_markdown:
        type: string
