        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: api_slug
              partition_field: list_slug
              stream:
                $ref: "#/definitions/streams/lists"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path: [_airbyte_attio_list_slug]
              value: "{{ stream_partition.list_slug }}"
            - type: AddedFieldDefinition
              path: [workspace_id]
              value: "{{ record['id']['workspace_id'] }}"
            - type: AddedFieldDefinition
              path: [target_id]
              value: "{{ record['id']['object_id'] }}"
            - type: AddedFieldDefinition
              path: [attribute_id]
              value: "{{ record['id']['attribute_id'] }}"
      schema_loader:
        type: InlineSchemaLoader
