        paginator:
          $ref: "#/definitions/offset_paginator_body"
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: api_slug
              partition_field: object_slug
              stream:
                $ref: "#/definitions/streams/objects"
      transformations:
        - type: AddFields
          fields:
            - type: AddedFieldDefinition
              path: [_airbyte_attio_object_slug]
              value: "{{ stream_partition.object_slug }}"
            - type: AddedFieldDefinition
              path: [workspace_id]
              value: "{{ record['id']['workspace_id'] }}"
            - type: AddedFieldDefinition
              path: [object_id]
              value: "{{ record['id']['object_id'] }}"
            - type: AddedFieldDefinition
              path: [record_id]
              value: "{{ record['id']['record_id'] }}"
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/record"

    list_attributes:
      type: DeclarativeStream
      name: list_attributes
      primary_key:
        - workspace_id
        - target_id
        - attribute_id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: "lists/{{ stream_partition.list_slug }}/attributes"
          http_method: GET
          request_parameters:
